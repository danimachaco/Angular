<div class="mb-3 mt-3">
  <label for="pwd" class="form-label">Password:</label>
  <input type="text" [(ngModel)]="nombrePadre" class="mb-3" placeholder="Introduce un nombre">
</div>
<div class="form-check">
  <button class=" mt-3 btn primary" (click)="alterarComponente()">
    {{ esVisible ? 'Ocultar ' : 'Mostrar' }} componente</button>
</div>

@if (esVisible) {
    <app-hijo [nombre]="nombrePadre"></app-hijo>
}
