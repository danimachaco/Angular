<h1>Ejercicio 2</h1>
<p>Crea una interfaz Persona con nombre y edad. Luego crea un objeto que implemente dicha interfaz.</p>
<div class="mb-3 mt-3">
  <label for="" class="form-label">Nombre:</label>
  <input type="text" [(ngModel)]="nombre" class="form-control" placeholder="Introduce un nombre">
</div>
<div class="mb-3 mt-3">
  <label for="" class="form-label">Edad:</label>
  <input type="number" [(ngModel)]="edad" class="form-control" placeholder="Introduce una edad">
</div>

<button type="button" (click)="enviarRespuesta2()" class="btn btn-info">Enviar respuesta 2</button>
