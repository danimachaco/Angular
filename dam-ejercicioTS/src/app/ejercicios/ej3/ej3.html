<h1>Ejercicio 3</h1>
<p>Crea un array de strings y muestra cada elemento por consola. Escribe nombres separados con comas en un campo de texto para convertir en array.</p>
<div class="mb-3 mt-3">
  <label for="" class="form-label">Array:</label>
  <input type="text" [(ngModel)]="palabra" class="form-control" placeholder="Introduce nombres">
</div>

<button type="button" (click)="enviarRespuesta3()" class="btn btn-info">Enviar respuesta 3</button>
