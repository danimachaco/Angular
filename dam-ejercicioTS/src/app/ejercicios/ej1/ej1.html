<h1>Ejercicio 1</h1>
<p>Crea una función llamada "suma" que reciba dos parámetros y devuelva su resultado.</p>
<div class="mb-3 mt-3">
  <label for="" class="form-label">Número 1:</label>
  <input type="number" [(ngModel)]="num1" class="form-control" placeholder="Introduce un número">
</div>
<div class="mb-3 mt-3">
  <label for="" class="form-label">Número 2:</label>
  <input type="number" [(ngModel)]="num2" class="form-control" placeholder="Introduce un número">
</div>

<button type="button" (click)="enviarRespuesta1()" class="btn btn-info">Enviar respuesta 1</button>
